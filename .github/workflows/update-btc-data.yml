name: Update crypto data

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "update-btc-data.js"
      - "data/*.daily.json"
      - "data/health.json"
      - ".github/workflows/update-btc-data.yml"

permissions:
  contents: write
  issues: write

jobs:
  update-crypto-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update crypto data
        run: node update-btc-data.js

      - name: Verify data and product regressions
        run: npm test

      - name: Verify generated health manifest
        run: npm run health:check

      - name: Cross-check latest candles with Kraken
        run: npm run data:cross-check

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.daily.json data/*.daily.js data/health.json data/health.js data/daily-summary.json data/daily-summary.js data/cross-check-latest.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update crypto daily data"
            git push
          fi

      - name: Open or update failure alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automated crypto data update failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const body = `The daily data update failed at ${new Date().toISOString()}.\n\nRun: ${runUrl}`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close recovered failure alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automated crypto data update failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `The daily data update recovered in run ${context.runId}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }
