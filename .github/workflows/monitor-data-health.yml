name: Monitor published data health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/health.json"
      - "scripts/check-data-health.js"
      - ".github/workflows/monitor-data-health.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: published-data-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify published health manifest
        run: node scripts/check-data-health.js --url https://www.mybtcbox.com/data/health.json --max-lag 2

      - name: Open or update published health alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Published crypto data health check failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const body = `The published data health check failed at ${new Date().toISOString()}.\n\nRun: ${runUrl}\nStatus: https://www.mybtcbox.com/status.html`;
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Close recovered published health alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Published crypto data health check failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `The published data health check recovered in run ${context.runId}.`
              });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
            }
